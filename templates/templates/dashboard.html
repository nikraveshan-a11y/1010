<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>داشبورد حسابداری</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; }
        .header { background: #2c3e50; color: white; padding: 15px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .header a { color: white; text-decoration: none; background: #e74c3c; padding: 8px 15px; border-radius: 5px; }
        .container { display: flex; gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); flex: 1; text-align: center; }
        .card h3 { color: #555; }
        .card .amount { font-size: 24px; font-weight: bold; color: #27ae60; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h2>📊 خوش آمدید</h2>
        <a href="/logout">خروج از حساب</a>
    </div>
    
    <div class="container">
        <div class="card">
            <h3>💰 کل درآمدها</h3>
            <div class="amount">۰ ریال</div>
        </div>
        <div class="card">
            <h3>💸 کل هزینه‌ها</h3>
            <div class="amount" style="color: #e74c3c;">۰ ریال</div>
        </div>
        <div class="card">
            <h3>📈 مانده حساب</h3>
            <div class="amount">۰ ریال</div>
        </div>
    </div>
</body>
</html>
