<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود به سیستم حسابداری</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #eef2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        input { width: 100%; box-sizing: border-box; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; }
        button { width: 100%; padding: 12px; background-color: #2c3e50; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        button:hover { background-color: #1a252f; }
        .error { color: #e74c3c; margin-top: 15px; font-size: 14px; background: #fadbd8; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>📊 سیستم حسابداری</h2>
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="نام کاربری" required>
            <input type="password" name="password" placeholder="رمز عبور" required>
            <button type="submit">ورود به سیستم</button>
        </form>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <p style="font-size: 12px; color: #888; margin-top: 20px;">نام کاربری: admin | رمز: 123456</p>
    </div>
</body>
</html>
